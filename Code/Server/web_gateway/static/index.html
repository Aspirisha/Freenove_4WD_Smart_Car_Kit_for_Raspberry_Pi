<!DOCTYPE html>
<html>
  <head>
  <link rel="stylesheet" href="styles.css">
</head>
  <body>
    <div id="container">
      <img id="video" src="/video.mjpg"/>
      <div id="telemetry">
        <div>Voltage: <span id="v">--</span> V</div>
        <div>Current: <span id="i">--</span> mA</div>
        <div>Power: <span id="p">--</span> W</div>
        <div>Timestamp: <span id="datetime">--</span> </div>
      </div>
    </div>
    <div id="joystick-container">
      <div id="joystick-zone">
        <div id="joystick-knob"></div>
      </div>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
