<!DOCTYPE html>
<html>
  <head>
  <link rel="stylesheet" href="styles.css">
</head>
  <body>
    <div id="container">
      <img id="video" src="/video.mjpg"/>
      <div id="telemetry">
        <div>Voltage: <span id="v">--</span> V</div>
        <div>Current: <span id="i">--</span> mA</div>
        <div>Power: <span id="p">--</span> W</div>
      </div>
    </div>
    <br>
    <button onclick="sendKey('down', 'ArrowUp')">Up</button><br>
    <button onclick="sendKey('down', 'ArrowLeft')">Left</button>
    <button onclick="sendKey('down', 'ArrowRight')">Right</button><br>
    <button onclick="sendKey('down', 'ArrowDown')">Down</button>

    <script src="/app.js"></script>
  </body>
</html>
